id: com.igalia.wig
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions: 
  - org.freedesktop.Sdk.Extension.llvm22
separate-locales: false
command: wig
finish-args: 
  - --device=all
  - --env=XR_RUNTIME_JSON=/app/share/openxr/1/openxr_monado.json
  - --filesystem=home
  - --filesystem=xdg-download
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland
modules: 
  - name: libevent
    config-opts:
      - --disable-static
    cleanup:
      - /bin
      - /lib/pkgconfig
      - /lib/*.la
      - /include
    sources:
      - type: archive
        url: https://github.com/libevent/libevent/releases/download/release-2.1.13-stable/libevent-2.1.13-stable.tar.gz
        sha256: f7e9383b8c0baa81b687e5b5eecc01beefaf1b19b64151d95ed61647fe7a315c

  - name: openxr
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DDYNAMIC_LOADER=ON
      - -DBUILD_TESTS=OFF
      - -DBUILD_API_LAYERS=OFF
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/KhronosGroup/OpenXR-SDK.git
        tag: release-1.1.62
        commit: 00678df64b49ad878a8e882af933c28518cafd1c

  - name: eigen
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_TESTING=OFF
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.bz2
        sha256: b4c198460eba6f28d34894e3a5710998818515104d6e74e5cc331ce31e46e626

  # libbsd lets monado-service detect a running instance with a pidfile and
  # remove a stale socket.
  - name: libmd
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.la
      - /share/man
    sources:
      - type: archive
        url: https://archive.hadrons.org/software/libmd/libmd-1.3.0.tar.xz
        sha256: fc0f1eb6b6766470326f2c014693809190e67dba84274a6fbae9d4912d066706

  - name: libbsd
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.a
      - /lib/*.la
      - /share/man
    sources:
      - type: archive
        url: https://libbsd.freedesktop.org/releases/libbsd-0.12.2.tar.xz
        sha256: b88cc9163d0c652aaf39a99991d974ddba1c3a9711db8f1b5838af2a14731014

  # The Monado OpenXR runtime, both monado-service and its client library.
  # They must be the same version, so the host's Monado isn't used. The socket
  # and the pidfile are placed in $XDG_RUNTIME_DIR/app/com.igalia.wig, which
  # Flatpak shares between all instances of the app.
  - name: monado
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DXRT_BUILD_SAMPLES=OFF
      - -DXRT_FEATURE_OPENVR=OFF
      - -DXRT_FEATURE_STEAMVR_PLUGIN=OFF
      - -DXRT_INSTALL_SYSTEMD_UNIT_FILES=OFF
      - -DXRT_INSTALL_ABSOLUTE_SYSTEMD_UNIT_FILES=OFF
      - -DXRT_IPC_MSG_SOCK_FILENAME=app/com.igalia.wig/monado_comp_ipc
      - -DXRT_IPC_SERVICE_PID_FILENAME=app/com.igalia.wig/monado.pid
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/monado/monado.git
        commit: 22d5c936ccc7218e7d139c7d921456c49ff5aaf1

  - name: webkitwpe
    buildsystem: cmake-ninja
    build-options: 
      append-path: /usr/lib/sdk/llvm22/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
    config-opts: 
      - -DPORT=WPE
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_C_COMPILER=clang
      - -DCMAKE_CXX_COMPILER=clang++
      - -DDEVELOPER_MODE_FATAL_WARNINGS=0
      - -DENABLE_EXPERIMENTAL_FEATURES=0
      - -DENABLE_DOCUMENTATION=0
      - -DENABLE_INTROSPECTION=0
      - -DENABLE_SPEECH_SYNTHESIS=0
      - -DENABLE_THUNDER=0
      - -DENABLE_WEBXR=1
      - -DENABLE_WEBXR_LAYERS=1
      - -DENABLE_WPE_LEGACY_API=0
      - -DENABLE_WPE_PLATFORM=1
      - -DENABLE_WPE_PLATFORM_DRM=0
      - -DENABLE_WPE_PLATFORM_HEADLESS=0
      - -DENABLE_WEB_RTC=ON
      - -DENABLE_WK_WEB_EXTENSIONS=ON
      - -DUSE_LIBBACKTRACE=0
      - -DUSE_SYSTEM_UNIFDEF=0
      - -DUSE_VULKAN=0
    sources: 
      - type: git
        url: https://github.com/WebKit/WebKit.git
        branch: main
  - name: wpe-platform-gtk
    buildsystem: meson
    sources: 
    - type: git
      url: https://github.com/Igalia/wpe-platform-gtk.git
      branch: main
  - name: template-glib
    buildsystem: meson
    sources: 
    - type: git
      url: https://gitlab.gnome.org/GNOME/template-glib.git
      branch: main
  - name: wig
    buildsystem: meson
    sources: 
    - type: git
      url: https://github.com/Igalia/wig.git
      branch: main
